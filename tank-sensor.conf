# /data/dbus-tank-ads1115/tank-sensor.conf — Tank sensor configuration
# Edit this file to match your tank and sensor setup

# Tank capacity in cubic meters (m3). Venus OS uses m3 internally.
# Examples: 0.08 = 80L, 0.1 = 100L, 0.15 = 150L, 0.2 = 200L
CAPACITY=0.08

# Fluid type: 0=Fuel, 1=Fresh water, 2=Waste water, 3=Live well, 4=Oil, 5=Black water
FLUID_TYPE=1

# Reference resistor in the voltage divider (ohms)
R_REF=100

# Sensor resistance when tank is EMPTY (ohms)
R_EMPTY=10

# Sensor resistance when tank is FULL (ohms)
R_FULL=180

# I2C bus number (1 = GPIO header on RPi)
I2C_BUS=1

# I2C address of ADS1115 (0x48 = ADDR pin to GND)
I2C_ADDR=0x48

# ADC channel (0-3)
ADC_CHANNEL=0

# Polling interval in seconds
POLL_INTERVAL=3

# Number of samples for sliding average (smoothing)
SAMPLES=5
